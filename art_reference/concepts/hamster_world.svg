      <stop offset="0.25" stop-color="#cfe9ff"/>
      <stop offset="0.45" stop-color="#a9cde6"/>
      <stop offset="0.65" stop-color="#9fbfd6"/>
      <stop offset="0.85" stop-color="#c7d3e0"/>
      <stop offset="1" stop-color="#fff2c9"/>
    </linearGradient>
    <linearGradient id="skyFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9a86a"/>
      <stop offset="0.17" stop-color="#b5c46a"/>
      <stop offset="0.26" stop-color="#8fc45a"/>
      <stop offset="0.36" stop-color="#5f8f3e"/>
      <stop offset="0.52" stop-color="#3f6b33"/>
      <stop offset="0.6" stop-color="#6e9a6a"/>
      <stop offset="0.7" stop-color="#9bb3a5"/>
      <stop offset="0.74" stop-color="#e9eff5"/>
      <stop offset="0.88" stop-color="#f6f9fc"/>
      <stop offset="1" stop-color="#f7efd2"/>
