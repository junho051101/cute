      <path d="M15 6 L 15 28 M6 13 L 24 13" stroke="var(--trim,#5a3c1e)" stroke-width="2"/>
    </symbol>

    <symbol id="tree" viewBox="0 0 60 110" overflow="visible">
      <rect x="26" y="80" width="8" height="30" fill="#4a3322"/>
      <path d="M30 0 L 52 40 L 8 40 Z" fill="currentColor"/>
      <path d="M30 20 L 57 64 L 3 64 Z" fill="currentColor"/>
      <path d="M30 42 L 60 88 L 0 88 Z" fill="currentColor"/>
