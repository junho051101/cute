    <path d="M1060 580 L 1150 380 L 1220 470 L 1300 300 L 1380 450 L 1440 360 L 1520 580 Z" fill="#8ea3b8"/>
    <path d="M1150 380 L 1172 430 L 1160 425 L 1140 440 L 1130 425 Z M1300 300 L 1328 360 L 1312 352 L 1296 372 L 1282 350 L 1270 362 Z M1440 360 L 1462 400 L 1445 395 L 1430 410 L 1420 395 Z" fill="#ffffff"/>
