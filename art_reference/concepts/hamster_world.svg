      <path d="M36 24 L 48 4 L 52 30 Z" fill="currentColor"/>
      <path d="M21 28 L 22 15 L 30 25 Z" fill="#f2a7a7" opacity="0.8"/>
      <circle cx="32" cy="42" r="20" fill="currentColor"/>
      <ellipse cx="23" cy="39" rx="4.2" ry="5" fill="var(--eye, #ffd54a)"/>
      <ellipse cx="38" cy="39" rx="4.2" ry="5" fill="var(--eye, #ffd54a)"/>
      <ellipse cx="23" cy="39" rx="1.2" ry="4" fill="#111"/>
      <ellipse cx="38" cy="39" rx="1.2" ry="4" fill="#111"/>
      <path d="M28 48 l2 3 l2 -3 Z" fill="#e88a8a"/>
      <path d="M30 51 q -4 4 -8 2 M30 51 q 4 4 8 2" stroke="#222" stroke-width="1.2" fill="none" opacity="0.6"/>
      <path d="M14 47 h-12 M14 50 l-11 4 M46 47 h12 M46 50 l11 4" stroke="#222" stroke-width="1" opacity="0.45"/>
    </symbol>

